<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>파운데이션 강의 자료 보기</title>
<style>
  @font-face {
    font-family: 'SpokaHanSansNeo';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2108@1.1/SpoqaHanSansNeo-Thin.woff') format('woff');
    font-weight: 100;
    font-display: swap;
  }
  @font-face {
    font-family: 'SpokaHanSansNeo';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2108@1.1/SpoqaHanSansNeo-Light.woff') format('woff');
    font-weight: 300;
    font-display: swap;
  }
  @font-face {
    font-family: 'SpokaHanSansNeo';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2108@1.1/SpoqaHanSansNeo-Regular.woff') format('woff');
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: 'SpokaHanSansNeo';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2108@1.1/SpoqaHanSansNeo-Medium.woff') format('woff');
    font-weight: 500;
    font-display: swap;
  }
  @font-face {
    font-family: 'SpokaHanSansNeo';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2108@1.1/SpoqaHanSansNeo-Bold.woff') format('woff');
    font-weight: 700;
    font-display: swap;
  }

  :root {
    color-scheme: dark;
    --bg: #0D1D32;
    --text: #ffffff;
    --muted: rgba(255,255,255,.62);
    --line: rgba(255,255,255,.18);
    --card-text: #111111;
    --card-muted: #727272;
    --card-line: #e8e8e8;
    --radius: 22px;
    font-family: 'SpokaHanSansNeo', sans-serif;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'SpokaHanSansNeo', sans-serif;
  }
  button, a, input { font: inherit; }
  button { color: inherit; }
  .app { min-height: 100vh; background: var(--bg); }

  /* list */
  .list-page {
    width: min(1180px, calc(100% - 48px));
    margin: 0 auto;
    padding: 76px 0 96px;
  }
  .eyebrow {
    color: rgba(255,255,255,.48);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .16em;
    text-transform: uppercase;
  }
  h1 {
    margin: 12px 0 14px;
    font-family: 'SpokaHanSansNeo', sans-serif;
    font-weight: 700;
    font-size: clamp(34px, 5vw, 58px);
    line-height: 1.12;
    letter-spacing: -.035em;
  }
  .lead {
    margin: 0 0 36px;
    color: var(--muted);
    line-height: 1.75;
    font-size: 15px;
    font-weight: 400;
  }
  .lesson-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
  }
  .lesson-card {
    appearance: none;
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas:
      "title arrow"
      "meta arrow";
    column-gap: 30px;
    row-gap: 8px;
    align-items: center;
    align-content: center;
    min-height: 142px;
    padding: 28px 32px;
    border: 1px solid rgba(255,255,255,.06);
    border-radius: 28px;
    background: #ffffff;
    color: var(--card-text);
    text-align: left;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(0,0,0,.12);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .lesson-card::after {
    content: '→';
    grid-area: arrow;
    width: 58px;
    height: 58px;
    border: 0;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: #111111;
    color: #ffffff;
    font-size: 29px;
    line-height: 1;
    font-weight: 400;
    transition: transform .18s ease, background .18s ease;
  }
  .lesson-card:hover::after { transform: translateX(2px); background: #000000; }
  .lesson-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 16px 38px rgba(0,0,0,.18);
  }
  .lesson-card strong {
    grid-area: title;
    display: block;
    margin: 0;
    font-family: 'SpokaHanSansNeo', sans-serif;
    font-weight: 700;
    font-size: 27px;
    line-height: 1.22;
    letter-spacing: -.03em;
    color: #111111;
  }
  .lesson-card .meta {
    grid-area: meta;
    margin-top: 0;
    color: var(--card-muted);
    font-size: 16px;
    line-height: 1.5;
    font-weight: 400;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .lesson-card .meta > span:first-child { color: var(--card-muted); }
  .lesson-card .meta > span:first-child::after { content: ''; }
  .badge {
    border: 1px solid #d9d9d9;
    background: #f7f7f7;
    color: #3b3b3b;
    border-radius: 999px;
    padding: 4px 8px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .05em;
  }

  /* viewer */
  .viewer-page { height: 100vh; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); }
  .toolbar {
    height: 68px;
    flex: 0 0 68px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 18px;
    border-bottom: 1px solid var(--line);
    background: rgba(13,29,50,.96);
    backdrop-filter: blur(14px);
    z-index: 10;
  }
  .toolbar-left, .toolbar-right { display: flex; gap: 9px; align-items: center; }
  .toolbar-right { justify-content: flex-end; }
  .toolbar .viewer-title, .toolbar .page-count, .toolbar .toolbtn { color: #ffffff; }
  .toolbtn {
    border: 1px solid var(--line);
    background: rgba(255,255,255,.06);
    border-radius: 12px;
    height: 40px;
    padding: 0 14px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-weight: 500;
  }
  .toolbtn:hover { background: rgba(255,255,255,.11); border-color: rgba(255,255,255,.35); }
  .toolbtn.primary { background: #ffffff; border-color: #ffffff; color: #111111; }
  .toolbtn:disabled { opacity: .35; cursor: default; }
  .title-wrap { text-align: center; min-width: 0; }
  .viewer-title {
    font-family: 'SpokaHanSansNeo', sans-serif;
    font-weight: 700;
    letter-spacing: -.025em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .page-count { margin-top: 3px; font-size: 12px; color: var(--muted); }
  .stage {
    min-height: 0;
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 92px 30px;
    background: var(--bg);
  }
  .slide-shell { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; }
  .slide-img { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; display: block; border-radius: 0; box-shadow: none; user-select: none; -webkit-user-drag: none; image-rendering: auto; }
  .navbtn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 54px;
    height: 72px;
    border-radius: 16px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,.08);
    color: #ffffff;
    backdrop-filter: blur(10px);
    cursor: pointer;
    font-size: 30px;
    display: grid;
    place-items: center;
    z-index: 4;
  }
  .navbtn:hover { background: rgba(255,255,255,.14); }
  .navbtn.prev { left: 20px; }
  .navbtn.next { right: 20px; }
  .navbtn:disabled { opacity: .22; cursor: default; }
  .loading {
    position: absolute;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    z-index: 5;
    padding: 8px 12px;
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 999px;
    background: rgba(13,29,50,.86);
    color: rgba(255,255,255,.78);
    font-size: 12px;
    line-height: 1;
    pointer-events: none;
  }
  .loading[hidden] { display: none !important; }

  @media (max-width: 820px) {
    .lesson-grid { grid-template-columns: 1fr; }
    .toolbar { grid-template-columns: auto 1fr auto; padding: 0 10px; }
    .toolbtn .label { display: none; }
    .toolbtn { padding: 0 12px; }
    .stage { padding: 16px 58px 20px; }
    .navbtn { width: 42px; height: 60px; border-radius: 13px; }
    .navbtn.prev { left: 8px; }
    .navbtn.next { right: 8px; }
  }
  @media (max-width: 560px) {
    .list-page { width: min(100% - 24px, 1180px); padding-top: 42px; }
    .lesson-card {
      grid-template-columns: minmax(0, 1fr) auto;
      column-gap: 14px;
      min-height: 118px;
      padding: 20px 18px;
      border-radius: 18px;
    }
    .lesson-card strong { font-size: 22px; }
    .lesson-card::after { width: 44px; height: 44px; font-size: 22px; }
    .lesson-card .meta { font-size: 14px; }
    .stage { padding: 12px 48px 16px; }
    .viewer-title { font-size: 14px; }
  }
</style>
</head>
<body>
<div id="app" class="app"></div>

<script>
const LESSONS = [1, 3, 4, 5, 6, 7, 8, 9, 10];
const PAGE_TOTALS = {1:33, 3:34, 4:9, 5:60, 6:13, 7:14, 8:24, 9:20, 10:21};
const SCRIPTS = {"5": "오늘도 이론 수업이어서 제 화면만 보면 된다. 오늘 봐야 다음시간에 응용해서 타이포그래피를 해볼 수 있다.\n오늘은 4 가지 글씨체에 대해서 배워볼건데요\n● 세리프체\n첫번째로는 세리프에 대해서 먼저 알아볼게요\n세리프의 사전적 의미는\"장식처럼 달린 가는 선\"이에요\n여기 오른쪽에 보면 빨간색으로 세리프를 표시해봤어요\n이렇게 글씨 끝에 꼬리처럼 달려 있는 게 있죠?\n이런 글씨를 세리프체라고 해요\n한국어로도 한 번 볼게요\n여러분 붓글씨 본 적 있어요?\n붓글씨도 여러 가지 종류의 글씨체가 있지만 대표적으로 보면\n이런 글씨체가 있어요 이 글씨체 끝부분을 보면 끝이 꺾여 있죠?\n이게 세리프체예요 느낌 오죠?\n이걸 한국말로 표현하면\"명조체\"라고 합니다\n​ 그럼 여기서, 우리 세리프체 봤을 때 어떤 느낌이 드는지 한번 이야기해보는 시간을 가져볼게요.\n> 답변\n이번에는 세리프체의 장점을 알려드릴게요\n세리프체는 뒤에서 배울 산세리프체에 비해서\n이 글자를 읽는 독자들의 이해도를 무려 5 배나 높여준다는 연구 결과가 있어요\n놀랍죠? 5 배는 엄청 큰 차이예요\n예를 들어, 책을 본다고 해볼게요\n눈에 들어오는 글자를 읽을 때 산세리프체보다는 세리프체가\n더 효과적으로 잘 읽힌다는 이야기예요\n그래서 책이나 신문이나 잡지나 논문 (어떤 것에 대해서 체계적으로 자기 의견이나 주장을 적은 글)\n같은 데를 보면 대부분이 세리프체로 되어 있습니다\n특히 전자책 같은 경우는 정말 많은 책이 세리프체로 되어 있어요\n전자책은 우리가 노트북이나 휴대폰이나 아이패드 이런 거로 보는 거죠?\n일반 종이책이 아니니까?\n전자책은 전자 기기를 통해서 봐야 되기 때문에\n눈이 피곤하면 안 돼요 / 그래야 책을 오래 볼 수 있겠죠\n그래서 전자책은 잘 읽히고\n그로 인해서 이해가 더 잘되게 만들어주는 글씨체라고 생각해주면 됩니다\n● 산세리프체\n이번에는 산세리프체를 한 번 볼게요\n세리프 앞에\"산\"이라는 글자가 붙어 있어요\n이건 프랑스어로\"san\"이라는 글자인데 이건\"없다\"라는 의미예요\n그래서 세리프가\"장식처럼 가는 선\"이라고 했죠?\n그 선이 없다는 의미예요\n그래서 글자를 보면 끝부분에 달려 있는 게 없고,\n뭐가 꺾여 있는 게 없습니다\n자 그러면 여기서 또, 산세리프체의 느낌이 어떤지 이야기를 나눠보고 가겠습니다\n> 답변\n산세리프체는 검은색과 특유의 딱딱한 분위기가 느껴져서\n강조를 하는 문구에 잘 어울려요\n그래서 실제로 제목 같은 데에는 이런 산세리프체가 많이 쓰입니다\n산세리프체의 또 다른 장점 같은 경우로는,\n산세리프체는 세리프체와는 달리 끝부분에 꺾여 있는 게 없죠?\n그러니까 어때요? 좀 깔끔한 느낌이 들죠?\n그리고 아까보다는 더 뚜렷한 느낌이 들어요\n왼쪽은 어떤 폰트, 오른쪽은 어떤 폰트를 사용했을 것 같아요?\n(로고 이미지 보여주기)\n● 서체의 변화\n서체의 변화를 한 번 살펴볼게요\n왼쪽이 과거 / 오른쪽이 현재예요\n자 과거에서 현재로 어떻게 변화되었어요?\n한 번 맞춰볼까요?\n우리 지금까지 배운 글씨체로 이뤄져 있어요\n정답: 세리프체 (명조)> 산세리프체 (고딕)\n우리 구글 알죠?\n수업 링크 들어올 때 매일 보는 거죠\n이 구글도 보면 세리프였는데 산세리프로 로고를 바꿨어요\n그 아래에 발망 / 버버리 라는 명품 브랜드도\n세리프였는데 산세리프로 로고를 바꿨어요\n왜 그랬을까요?\n왼쪽이랑 오른쪽이랑 비교해서 한 번 보세요\n> 눈에 더 명료하게 들어오기 때문에\n이렇게 눈에 확실히 들어오기 때문에 자연스럽게 가독성이 높아져요\n가독성이라는 건 얼마나 눈에 쉽게 읽히는지에 대한 정도를 말하는 거죠\n그래서 저희가 색채학을 배울 때 ‘명시성’ 이라고 해서 눈에 잘 들어오는 디자인에 대해서 배웠었죠.\n그런 것처럼 글자에서도 눈에 명확히 잘 들어오는 폰트라고 생각을 해주시면 됩니다\n그리고 산세리프체의 특징으로는,\n산세리프체는 현대적인 이미지를 가지고 있어요\n현대적이라는 거는 현대에 적합한, 현대와 어울리는 느낌이다 들어가기도 하는데\n거기서 글이 너무 다닥다닥 붙어 있고,\n글자를 읽을 수는 있지만 뭔가 좀 불편한 느낌이 들지 않도록 우리가 이런 자간 / 행간의 개념도 배우는 거예요\n자간은 글자와 글자 사이의 간격\n위의 글자랑 아래 글자 중에서 어떤 게 눈이 더 편한가요?\n행간은 행과 행 사이의 간격\n왼쪽 글자랑 오른쪽 글자 중에서 어떤 게 눈이 더 편한가요?\n● 폰트 다운로드\n내가 좋아하는 폰트 다운로드 1 개만 해보기\n우리는 OTF 로 다운받을 거예요\nOTF 는 맥용이고 TTF 는 윈도우용으로 권장하는데\nOTF 는 용량 자체가 커서 무한으로 늘어나고,\nTTF 는 제한이 있어요\n우리는 모두 OTF 로 받을 거예요\n아주 간혹 TTF 밖에 없는 것도 있기는 있어요\n그때는 TTF 로 받아도 되는데\n그런 경우가 아니라면 OTF 로 받아주세요\nㅠㅠ 이모티콘 알아요?\nㅜㅜ TTF 울고 있죠? 우는 거 말고 OTF 로 기억하면 돼요\n여기서 다운로드 시에 저작권 확인하기\n그리고 나중에 그림책 만들 때는 내가 어떤 폰트를 썼는지\n꼭 확인하고, 그 폰트를 찾아서 저작권을 확인해줘야 함\n● 다음 주 과제는\n감사 편지 작성하기 A4 반 사이즈 정도까지는 작성을 해주기\n최소 7 줄 이상 쓰기", "3": "● 명도\n색의 밝고 어두운 정도를 명도라고 해요\n이 명도는 빛의 양으로 표현이 되는데 두 가지로 표현을 해볼 수 있어요\n빛이 많을 때는 즉, 빛이 셀 때는\n(제일 진한 노란 컬러) 색깔이 쨍하게 보이는데\n색깔이 뚜렷하고 선명하게 보이는 거예요\n빛이 없을 때는 즉, 빛이 약할 때는\n(제일 왼쪽 노란 컬러) 이렇게 흐리멍텅하게 보여요\n잘 안 보이죠 이 노란색?\n그래서 책 같은 거 볼 때 불을 끄고 보게 되면\n불을 껐다는 건 빛이 없다는 거죠? 그때는 책이 잘 안 보여요\n색깔도 똑같아요. 색깔도 또렷하게 잘 들어오지 않습니다\n이 명도라는 단어를 기억할 필요는 없고\n\"아 빛에 의해서 색깔이 달라지도 한다\"라는 점을 생각하면 돼요\n● 채도\n색깔이 있고 없음을 채도라고 해요\n채도는 색채라고 하거든요?\n(가운데 빨강 컬러) 이 가운데 있는 빨간색을 기준으로 놓고 볼게요\n그런데 여기서 채도가 높아지면 어때요?\n(오른쪽 밝은 빨강) 이렇게 밝아지고 쨍해지죠?\n그럼 반대로 채도가 낮아지면 어때요?\n(왼쪽 어두운 검정) 이쪽으로 가면 어때요?\n탁하고 어두워지죠 예를 들어서, 흰색이나 검정색이나 회색 계열을 좋아하는 친구들 있죠?\n그런 색깔을 좋아하는 건\"무채색을 좋아한다\"라고 표현해요\n무는 없을 무라는 뜻이어서 색깔이 없다라는 뜻이에요\n그래서 만약에 내가 흰색, 검정색, 회색 이런 색깔을 좋아한다고 하면\n어떤 색이 존재하지 않는 것을 좋아하는 거예요\n그래서 무채색을 좋아한다고 말할 수 있습니다\n(오른쪽 밝은 빨강) 이렇게 색깔이 있는 건 유채색이라고 해요\n있을 유 / 그래서 색깔이 있는 것을 말하죠\n여기 계신 분들 중에 헌혈해본 적 있나요?\n아니면 병원에서 피 뽑아본 적 있나요?\n우리가 피를 나눠주려고 헌혈을 하거나\n아니면 내 몸의 건강 상태를 체크하기 위해서 병원에 가서\n주사로 피를 뽑을 때가 있어요\n그랬을 때 우리 피 색깔이 (가운데 빨강) 이런 색깔이 나와야 하거든요?\n그런데 내가 피를 뽑았는데\n(오른쪽 밝은 빨강) 이런 밝은 빨간색이 나온다면\n빈혈이라고 해서 몸에 피가 부족한 거예요\n매일 어지럽고 머리가 지끈지끈한 사람들, 빈혈이 있는 분들은\n피 색깔이 이렇게 밝게 나온다고 해요\n그리고 내가 소화가 잘 안 되고, 잘 얹히는 사람들은\n(왼쪽 2 번 빨강) 이런 색깔이 나와요\n그래서 이렇게 정상적인 피의 색깔을\n가운데에 있다고 해서 중채도 라고 합니다\n그리고 밝은 채도는 높을 고 / 고채도 라고 하고요\n그리고 어두운 채도는 낮을 저 / 저채도 라고 합니다\n혹시 탁하다는 말을 들어본 적 있나요?\n(모르는 사람 많아요) 우리 물감을 사용해봤죠?\n처음에는 물통이 깨끗했는데 내가 쓰던 붓을 물통에 넣으면\n물 색깔이 지저분해지죠? 물이 갑자기 뿌옇게 변하죠?\n그걸 바로 탁하다고 표현해요\n색깔이 좀 뿌얘졌다, 짙어졌다, 어두워졌다 이런 의미를 뜻해요\n● 색의 온도\n색깔에는 온도가 있어요 생각해 봤나요 여러분?\n(파란) 위에 보면 파란 색깔은 어때요?\n> 차갑다, 시원하다, 춥다\n찬물이랑 뜨거운물 틀 때 빨간색이랑 파란색으로 색깔 표시가 되어 있죠?\n\"뜨거운 물\"이라는 글자는 안 적혀 있지만\n당연히 빨간색을 보고 여기가 뜨거운 물이 나온다는 거를 알죠?\n자 그리고 화장실 갈 때도 치마 입고 있는 여자 아이콘이 있고,\n바지 입고 있는 남자 아이콘이 있죠\n그 아이콘으로도 구분을 하지만 색깔로도 구분을 할 수가 있죠\n빨간색 / 핑크색 이런 거는 여자 화장실이다\n파란색은 남자 화장실이다\n이렇게 알죠?\n근데 바지를 입은 남자 아이콘이 핑크 색깔을 하고 있고\n치마를 입은 여자 아이콘이 파란 색깔을 하고 있으면\n우리 너무 헷갈리지 않을까요?\n실제로 주변에 그런 공중화장실이 있어요\n그러면 들어가는 사람들이 너무 헷갈리겠죠\n아직까지는 우리한테 색깔에 대한 차이가 있어요\n방금 말했던 것처럼 남자는 파란색 / 여자는 핑크색\n이런 식으로요 (파란) 여기 위에 첫 번째 줄은 남자를 뜻하는 것 같고\n(빨간) 여기 아래 두 번째 줄은 여자를 뜻하는 것 같지 않아요?\n이렇게 푸른 계열은 남자 / 붉은 계열은 여자\n이런 식으로 나누는 문화가 아직까지 있다, 생각하면 됩니다\n그럼 이번에는 이 색의 온도를 나이와 관련해서 한 번 살펴볼게요\n예를 들어서, 내가 연륜이 좀 많고 할아버지나 할머니 아니면 성인을\n표현할 때는 어떤 색깔을 쓸까요?\n1 2 3 중에 어디로 갈까요?\n그럼 어린아이를 표현한다고 하면 무슨 색깔을 쓸까요?\n이번에는 중성색의 뜻을 알려줄게요\n중성색은 차갑지도 따뜻하지도 않은 색깔이에요\n그런데 여기는 좀 독특한 게 있어요\n예를 들어, 보라색이 파란색과 붙어 있으면 차가운 보라색의 느낌이 나고\n보라색이 빨간색이랑 붙어 있으면 따뜻한 보라색이 돼요\n그래서 어떤 컬러한테도 끌려가는 색깔이에요\n정리를 해보면 중성색은 따뜻한 색깔이다, 차가운 색깔이다 라고\n말할 수 없고 끌려가는 색깔이에요\n이렇게 색의 온도를 느껴보는 것도 좋아요\n내가 가지고 있는 물건들 중에 가장 많이 가지고 있는 컬러는 무엇일까도\n생각해볼 수 있겠죠\n>~~ 는 무슨 색깔이 가장 많은 것 같아요?\n* 주황색 이야기가 나오면\n주황색은 좋아하고 / 좋아하지 않고가 가장 확실히 차이나는 색깔이에요\n이걸 호불호라고 하거든요\n좋고 싫음이 확실한 거 / 그 기준이 바로 주황색이에요\n그래서 주황색을 좋아하는 사람들은\n주황색이 진짜 고급스럽다, 이쁘다, 세련됐다고 생각하는 사람들이 있고\n싫어하는 사람들은 주황색이 촌스럽고, 별로다 라고 생각하는 사람들이 있어요\n● 색의 무게\n색깔에는 무게가 있어요 딱 봐도 어떤 게 가벼운 색이에요?\n> 답변\n딱 봐도 윗줄이 가벼워 보이고 아랫줄이 무거워 보이죠?\n근데 지금 이거 무게 있어요?\n> 없죠? 근데 윗줄은 가벼워 보이고, 아랫줄은 무거워 보여요\n그래서 우리가 디자인을 할 때\n물건이 비싸 보이고 무거워 보이고 싶다면 무거운 색을 쓸 수 있고,\n저렴하고 가벼워 보이고 싶다면 이런 가벼운 색을 쓸 수 있겠죠?\n만약 내가 상품을 어른들한테 파는 걸로 디자인한다면\n(무거운색) 이런 세련된 색깔을 쓸 수 있겠죠\n만약에 초등학생, 청소년, 유치원생들한테 디자인한 거를 보여준다고 하면\n(가벼운색) 이런 밝은 색을 쓰겠죠?\n주로 따뜻한 색깔들이 가벼운 느낌이고\n좀 차가운 색깔이 무거운 느낌이 있어요\n● 유사색\n유사색은 서로서로 비슷한 색깔을 말하는 거예요\n유사색 이 3 가지 컬러 보고 딱 떠오르는 게 뭐가 있어요?\n> 나무, 감, 귤, 오렌지, 농구공 등\n(아마 과일도 있을걸요~?)\n감도 보면 위에 이파리 색깔, 껍질 색깔, 안에 살 색깔, 씨 색깔\n다 이런 색이죠?\n이렇게 비슷한 색깔이 모인 걸 유사색이라고 해요\n그럼 과일 중에서 비슷한 색깔끼리 모여 있는 과일이 뭔지 생각해볼까요?\n떠오르는 거 있어요? 주황색 아니어도 돼요\n> 호두, 시금치 (뿌리 색깔부터 줄기 색깔까지 색깔이 점점점 달라져요)\n연한 색깔에서 진한 색깔로 변해가요\n이걸 관찰해보면 되게 좋거든요?\n그래서 컬러 수업할 때는 한 주 동안은 여러분들이 먹는 음식에\n이 한 가지에 도대체 몇 개의 색깔이 들어가 있는 거지?\n한 번 확인해보세요 시금치 하나만 봐도 연한 연두색부터 초록색, 진한 초록색\n엄청 많아지거든요 그리고 오렌지 같은 걸 관찰해보면\n흰색도 들어가 있고, 찐한 주황색도 들어가 있고, 연한 주황색도 들어가 있고, 조금씩 달라요\n우리 다음 주도 색채 수업 할 거거든요?\n그래서 한 주 동안 내가 먹는 음식 중에\n어떤 색깔이 어떻게 조화롭게 되어 이루어져 있는지 많이 보세요\n그런데 과일 중에서는 반전이 있는 과일이 많아요\n반전 있는 과일은 뭐가 있을까요?\n> 딸기, 수박, 바나나,\n● 보색\n보색은 색깔이 뭉쳤을 때 서로에게 시너지 효과를 줄 수 있는 건데\n시너지 효과라는 건 뭐냐면\n서로를 빛나게 하는 거예요\n나랑 저 사람이 달라서 서로가 튀어 보이는 거예요\n(왼쪽) 수박 색깔 같은 거죠\n포인세티아라는 꽃 알아요?\n크리스마스 때 많이 보는 꽃이 있어요\n(이미지 보여주기) 빨간색이랑 초록색이랑 어우러져 있어서 눈에 확 띄죠\n(오른쪽) 이건 우리 스포츠 브랜드에서 많이 볼 수 있어요\n운동복을 보면 튀는 색깔들이 많아요\n활발하게 액션을 취하는 이런 운동을 하기 때문에 눈에 확 튀는\n컬러들을 많이 사용합니다\n그래서 강렬하고 화려한 느낌을 줄 때는\n서로가 반대되는 색깔을 매칭해주면 튀어 보일 수 있어요\n● 삼보색\n삼보색은 균일하고 안정된, 조화로운 색깔을 매칭할 수 있는 거라고\n얘기를 하는데, 이걸 외울 필요는 없어요\n모든 디자이너들이 이걸 보고 따라하지는 않아요\n예쁜 색깔을 조화롭게 사용하기 때문에 그래요\n삼보색은 퐁당퐁당 이라고 생각하면 돼요\n내가 만약에 노란색을 쓰고 싶다면 퐁당퐁당 해서\n주황색과 빨간색을 써주면 돼요\n● 약보색\n아까 우리가 보색을 봤는데 대비가 강했잖아요\n빨간색 & 초록색 / 파란색 & 노란색\n이런 식으로 강렬했죠?\n약보색은 강렬하기는 하지만\n보색보다는 덜 강렬한, 좀 더 부드러운 느낌을 주는 대비색입니다\n내가 보라색을 쓰고 싶다면\n보라색이랑 어울리는 게 뭐지? 생각을 했을 때,\n보라색에서 쭉 가다가 Y 자로 양쪽으로 꺾여요\n그래서 연두색이랑 주황색이에요\n다만, 이런 건 기준은 될 수 있지만 정답은 아니에요\n● 명시성\n명시성은 멀리서도 잘 보이는 정도를 말하는 거거든요?\n멀리서도 잘 보여야 돼요\n(왼쪽) 눈이 편해요, 아파요?\n(오른쪽) 눈이 편해요, 아파요?\n명시성이라는 건 먼 거리에서도 디자인이 잘 보이게끔 만들어주는 거예요\n예를 들어, 어떠한 정보를 디자인했는데\n눈에 잘 안 들어오니까 그 정보를 읽을 수가 없어요\n그럼 디자인을 잘못한 거겠죠?\n그래서 멀리서도 눈에 잘 들어오는 디자인을 하는 게 중요하다\n그리고 그건 컬러로도 영향을 미친다고 라고 생각하면 됩니다\n명시성이 높은 컬러들을 보면 유사색 쪽이 아니라\n컬러의 대비가 높아요 컬러들이 많이 차이가 나요\n예를 들어, 우리 수련회 같은 거 가보죠?\n거기에 조교나 도움을 주는 사람들이 있죠?\n그 사람들이 검정색에 하얀색 글자나\n하얀색 티에 검정색 글자가 적힌 옷을 많이 입어요\n왜냐면 그런 사람들은 눈에 튀어야 되니까요\n● 주목성\n주목 뭔지 알죠?\n말할 때 딱 집중하는 거 알죠?\n우리나라는 따뜻한 색깔의 픽토그램이 많을까요,\n어두운 색깔의 픽토그램이 많을까요?\n픽토그램이라는 게 뭔지 일단 배울 건데요\n픽토그램은 방향이나 여기가 뭔지를 알려주는 아이콘이에요\n예를 들어, 어린이 구역 같은 데 가보면\n세모에 노란색이랑 검정색으로 표지판 되어 있는 거 본 적 있어요?\n그런 게 픽토그램이에요 그리고 우리 화장실 가면 남자 / 여자 모양 아이콘 있죠?\n그리고 어디 건물 들어가면 비상구 모양의 아이콘 있죠?\n비상 터넷이나 핸드폰에 있는 모든 디자인을\n웹 디자인이라고 표현해요\n이런 웹에서 사용하는 컬러는 빛으로 표현이 되는 컬러예요\nRGB 는 레드 / 그린 / 블루 이 3 가지 컬러들의 이름을 따서 만든 단어예요\n● CMYK 란\nCMYK 는 인쇄물 디자인에서 사용하는 컬러예요\n우리가 보는 책, 교과서, 달력, 현수막 등등 인쇄가 되어서 나오는 모든 디자인을\n인쇄물 디자인이라고 표현해요\n우리가 인쇄를 할 때 잉크를 사용하죠?\n그 잉크로 표현이 되는 컬러를 CMYK 라고 합니다\n우리 프린트할 때 프린트기 안에\n잉크 충전하는 부분을 보셨다면 아실거에요\n잉크 보면 파란색 / 빨간색 / 노란색 / 검정색 이 4 가지 컬러들의\n이름을 따서 만든 용어예요\n● RGB 와 CMYK 2 가지를 사용하는 이유\nRGB 랑 CMYK 중에 하나만 쓰면 되는데 왜 2 가지나 사용하나요? 하고\n물어볼 수 있어요 RGB 는 빛으로 컬러가 표현되는 거라고 했죠?\nRGB 컬러를 서로 섞으면 굉장히 밝아져요\n그래서 인쇄를 하지 못하게 돼요\n그래서 디자인 프로그램으로 만든 색과 차이가 있기 때문에\n인쇄 전용을 위한 CMYK 컬러를 사용하는 거예요\n● 컬러별 의미\n(* 질문과 함께 진행)\n💡 초록: 휴식과 평화\n딱 떠오르거나 어떤 느낌이 드세요?\n초록색 자연에서 많이 보죠?\n그래서 자연과 관련된 회사나 기관에서 이 초록색을 많이 사용해요\n예를 들어서, 우리나라에서 운영하는 환경부라는 기관이있어요\n환경과 관련된 일을 하기 때문에 포스터를 만들거나\n책자를 만들 때 초록색을 자주 사용합니다\n그리고 농협 알아요?\n농산물 (쌀, 콩, 배추, 오이 등등) 이런 것들을 농산물이라고 하는데\n이걸 판매하는 곳이 있어요\n농협은 로고 글씨에 초록색이 있어요\n농협도 초록색을 주로 사용하는데, 초록색에 파릇파릇한 느낌이 있죠?\n그래서 신선한 농산물을 판매하는 곳의 이미지가 잘 맞아떨어지는 거예요\n그다음 우리가 어피니티 유니버스 카페에 들어올 때\n네이버를 통해서 들어오죠?\n네이버도 무슨 초록색이에요\n그래서 우리가 네이버를 사용하는 동안 막 정신이 없는 게 아니라\n마음이 편안해지는 느낌이 드는 거예요\n그리고 우리가 초록색을 보면 차분하고 안정감이 들죠?\n네이버에서 그런 느낌도 담은 거예요\n💡 빨강: 역동적인 강렬함 (백점 시험지)\n(역동적> 힘차고 활발하게 움직이는 것)\n(강렬함> 강하고 세차다)\n예를 들어서, 우리가 표지판 같은 거 보면\n우리나라는 따뜻한 색깔의 난색을 주로 쓴다고 했죠?\n그래서 표지판에서도\"위험 / 주의\"이런 식으로 조심하라는 사인을\n빨간색으로 눈에 띄게 표시를 해줍니다\n왜냐하면 실제로 빨간색은 인간의 눈에 가장 잘 보이는 색상이에요\n눈에 확 들어오기 때문에\n빨간색은 식품 회사나 엔터테인먼트 회사에서 자주 사용해요\n식품 회사 중에는 대표적으로 코카콜라\n코카콜라 글자가 빨간색이죠?\n그리고 엔터테인먼트라는 거는 사람들이 즐길 수 있는 문화를 말해요\n대표적으로는 유튜브가 있어요\n유튜브도 로고 색상을 보면 빨간색이 메인이에요\n눈에 되게 잘 띄죠?\n💡 주황: 창조적인 감각 (좋아하세요? 싫어하세요?)\n컬러 중에서 가장 호불호가 높은 색상이에요\n호: 한자로 좋을 호여서 ' 좋다 ' 는 의미이구요\n불호: 호가 아니다 ' 좋지 않다 ' 는 의미예요\n그래서 호불호가 높다는 의미는 좋고 / 싫음이 분명하다라는 거예요\n\"음 주황색 괜찮은 거 같아. 주황색 나쁘지 않아\"이런 느낌보다는\n\"나는 주황색이 좋아\"\"나는 주황색 싫어해\"이런 식으로\n분명하게 갈리는 컬러입니다\n그래서 어떤 사람은 이 주황색을 세련됐다고 보기도 하고,\n또 어떤 사람은 이 주황색을 촌스럽게 느끼기도 해요\n주황색은 창조적인 감각이 느껴지는 컬러라고 했죠?\nFanta 라는 음료가 있어요, 과일 맛이 나는 청량음료 브랜드인데\nFanta 가 Fantastic 환상적이다라는 그 단어를 줄여서 만든 이름이에요\nFanta 를 먹으면\"어디서도 맛볼 수 없는 환상적인 맛을 경험할 거야!\"하는 느낌을 주는 거죠\n💡 노랑: 행복과 희망\n주변에서 흔히 볼 수 있는 노란색은 카카오톡 / 이마트 / 국민은행\n우리가 자주 사용하는 카카오톡을 보면\n주로 노란색을 메인 컬러로 사용하죠\n카카오톡이 노란색을 선택한 이유는\n카카오톡을 사용하면서 행복감을 느끼도록 만드는 거예요\n그리고 노란색은 남녀노소 구분 없이 구매욕 (무언가를 사고 싶어지게 만드는 욕구) 을 높이는 컬러예요\n예를 들어 우리가 시리얼 사러 갔어요\n근데 종이 박스로 포장이 되어 있죠\n똑같은 맛인데 하나는 회색으로 포장이 되어 있고,\n하나는 노란색으로 포장이 되어 있어요\n여러분은 어떤 걸 선택하고 싶어요?\n그럴 때 대부분의 사람이 노란색을 선택해요\n이게 바로 구매욕을 높이는 현상이라고 말할 수 있어요\n그리고 국민은행 이라는 은행도 노란색 컬러를 사용하는데\n이 노란색이 우리 은행에 돈을 맡기면\n\"돈이 더 많아져요. 행복해져요 희망이 생겨요\"하는 느낌을 전달해줍니다\n이런 느낌을 통해서 이 은행을 선호하게 되고\n이 은행과 더 가까운 느낌 친근함이 들도록 만들어줍니다\n💡 파랑: 믿음과 신뢰\n파란색은 전 세계 기업들 중에서 가장 선호하는 컬러입니다\n그리고 전 세계 기업뿐만 아니라\n전 세계인들 사이에서도 가장 선호하는 컬러 1 위가 파란색이에요\n그만큼 파란색이 주는 느낌이 굉장히 좋다는 거겠죠\n먼저 파란색은 믿음과 신뢰감을 줍니다\n예를 들어서 앱스토어, 페이스북, 삼성 / 갤럭시 핸드폰 쓰는 친구들은 다 삼성을 알 거예요\n삼성의 대표 컬러가 바로 파란색이에요\n이런 기업에서 파란색을 선택하는 이유는\n회사의 신뢰감 있는 이미지를 주기 위함이에요\n\"여기 회사 제품은 믿고 살 수 있어\"이런 느낌을 주는 거죠\n그라데이션에서 남색 같이 설명하기\n💡 남색: 격조와 권위 (교복)\n(격조> 사람의 품격과 취향 / 권위> 지휘하고 통솔하여 따르게 하는 힘)\n남색은 파란색과 보라색의 중간색이에요\n파란색보다 더 깊고 어두우면서 무게감이 느껴지는 컬러죠\n권위가 느껴진다고 했는데 우리 경찰복을 생각해보면 돼요\n경찰들이 입는 옷을 말하는 거예요\n위에는 청록색이고, 바지는 남색이에요\n경찰복이 옛날부터 지금까지 많이\n바뀌었는데 남색을 많이 사용한 게 보입니다\n그런 권위를 가지고 있는 사람들이나 직업군에서 주로 사용되는 컬러입니다\n💡 보라: 신비로움과 우아함\n(우아함: 고상하고 기품이 있고 아름답다)\n보라색 같은 경우는 신비롭고 우아한 느낌으로 연상이 돼요\n그래서 화장품이나 미용 관련 브랜드에서 보라색을 많이 사용하는데요\n보라색은 색깔을 만들 때 염료 (잉크 같은 거) 가 필요한데\n아주 옛날에는 그 색깔의 염료를 구하는 게 너무 어려웠대요\n그래서 보라색을 굉장히 특별하게 여겨서\n신분이 높은 소수들만 사용을 한 거예요\n그러다 보니까 보라색이 사용된 화장품 케이스를 보면서\n성분도 되게 좋을 것 같고 내가 이 화장품을 쓰면\n내 피부가 좋아질 것 같은 느낌이 들기도 합니다.\n그리고 또, 보라색! 하면 떠오르는 우리나라 대표 브랜드가 하나 있죠?\n바로 마켓컬리 입니다.\nROSA 바이올린 레슨 로고 – 채아 디렉터님 제작\n💡 자주: 매혹적인 화려함\n자주색은 포도주스 색깔이라고 생각하면 돼요\n이 자주색에는 마젠타 / 버건디 이런 색상도 있는데요\n마젠타는 보라색과 빨간색의 경계색이고,\n버건디는 와인색이라고 생각하면 돼요\n팬톤이라는 컬러 개발 회사가 있어요\n거기서는 다양한 컬러들을 개발하고 그 컬러에 이름을 만들어주는\n그런 회사인데 거기서\"올해의 컬러는 이 색깔입니다~\"하고 발표를 해요\n그러면 많은 브랜드에서 그 컬러를 사용해서\n옷이나 신발이나 가방을 만들어요\n그만큼 영향력이 있는 브랜드죠\n그런데 2023 년 올해의 컬러가 바로\"비바 마젠타\"였어요\n비바 마젠타가 어떤 컬러인지 보여드릴게요\n블리스 – 캔들 제품 판매하는 곳, 이 디자인을 한 후로 굉장히 유명해졌습니다. 중국을 타깃으로 맞춤 제작한 것이어서 이후 좋은 결과를 얻었습니다.\n💡 갈색: 풍부함과 중후함 (똥)\n갈색은 우선 묵직한 느낌, 차분한 느낌이 들어요\n노란색, 주황색 이런 컬러와는 느낌이 많이 달라요\n어린이들보다는 어른들이 주로 사용하는 제품에 많이 들어갑니다\n갈색은 고급스러운 느낌을 주기 때문에\n비싼 제품들에 많이 사용이 되는데\n예를 들어, 명품 가방 브랜드를 보면 갈색을 사용하는 경우가 많이 있어요\n\"이 가방을 들면 당신의 가치가 올라갑니다\"하는 느낌을 주는 거예요\n💡 회색: 지적미와 안정감\n회색은 지적미와 안정감이라는 느낌을 주기 때문에\n자동차 회사에서 정말 많이 사용하는 컬러입니다\n자동차는 안전한 게 정말 중요하죠\n그래서 자동차를 안전하고 튼튼하게 보이는 느낌을 줘야 돼요\n회색은 차분하고 안정감이 드는 색깔이기 때문에\n\"이 차를 타면 정말 편안하게 안정감 있게 운전을 할 수 있어요\"하는\n느낌을 줄 수가 있어요 그리고 자동차 말고도 우리 컴퓨터에서도 맥 컴퓨터가 있어요\n애플에서 만든 맥 컴퓨터는\n컴퓨터 컬러가 회색이에요\n\"이 컴퓨터 잘 고장나지 않아요\"하는 안정감을 주는 거죠\n그리고\"이 컴퓨터는 똑똑해요\"하는 지적미를 주기도 해요\n스마트해 보이는 느낌인 거죠\n올림 – 중국 영상 회사\nJS – 주신오토, 자동차 부품 판매하는 브랜드\n💡 흰색: 순결과 청결함\n흰색은 보이는 것처럼 깨끗한 느낌을 표현하는 컬러죠\n아기 기저귀 같은 거를 보면 하얀색이죠\n아기 피부에 닿는 거기 때문에 제품이 안전하고\n독성이 없고 아주 순한 제품이에요 하는 느낌을 줄 수가 있어요\n💡 검정: 힘과 고급스러움\n검정색은 파란색만큼 세계의 기업에서 많이 사용하는 컬러예요\n검정색은 세련되고 힘이 있는 느낌을 주거든요\n이 기업이 가벼운 느낌이 아니라, 무게가 있고\n오랜 경력을 갖춘 느낌을 줄 수 있어요\n\"이 기업은 안정적이에요\"하는 느낌을 주는 거죠\n저희가 소속되어 있는 브리스가 목사님이 하고 계신 밸류체인 홀딩스인데, 그 로고가 이렇게 생겼습니다.\n밸디의 앰블럼\n● 나라별 컬러 차이\n나라별 컬러는 그 나라의 역사나 문화에 따라서 달라집니다\n💡 우리나라에서는 노란색이 행복과 희망을 상징한다고 했죠?\n노란색 자체가 밝고 따뜻한 느낌이어서 행복과 희망이라는 느낌이\n굉장히 잘 어울리는데, 프랑스에서는 질투를 상징한대요\n그리고 중국에서는 노란색을 황제의 색이라고 여긴대요\n💡 그리고 중국은 국기도 빨간색인 것처럼 빨간색을 가장 좋아합니다\n빨간색이 부를 상징한다고 믿기 때문이에요\n그런데 독일에서는 빨간색을 불운을 나타낸다고 생각한대요\n💡 흰색은 순수함과 청결함의 의미를 담고 있죠\n스위스나, 멕시코는 흰색을 기쁨이라는 의미로 생각해서 굉장히 선호합니다\n그런데 중국과 일본에서는 흰색을 장례의 의미를 지니고 있어서\n선호하지 않는다고 합니다\n심지어 중국인들한테 흰색 봉투에 넣어서 편지를 보내게 되면\n\"이제 너랑 더 이상 안 만날 거야!\"할 정도의 의미를 담고 있다고 합니다\n+ 과제 안내 폰트 다운로드\n---------------------------\n● RGB 8 / RGB 16 차이\n8 과 16 은 비트라는 거예요\n비트라는 거는 모니터에서 표현하는 색상의 수를 말해요\n그럼 숫자가 8 과 16 중에 16 이 크죠?\n그러면 8 보다 16 비트에서 더 많은 색상이 표현되겠죠?\n그런데 16 비트로 설정을 해놓고 디자인을 하게 되면\n이 프로그램의 데이터 크기가 엄청 커져요\n그래서 간혹 작업할 때 느려지기도 해서 우리는 8 비트를 사용하고 있어요"};
const SCRIPT_TITLES = {"3": "파운데이션 3강 · 색채학", "4": "파운데이션 4강 · 색채학 응용", "5": "파운데이션 5강 · 타이포"};
const app = document.getElementById('app');

const LESSON_TOPICS = {
  1: '튜토리얼 자료 보기',
  3: '색채학 자료 보기',
  4: '픽셀아트 자료 보기',
  5: '타이포그래피 자료 보기',
  6: '라인 드로잉 자료 보기',
  7: '클리핑마스크 자료 보기',
  8: '클리핑마스크 응용 자료 보기',
  9: '그래픽 효과 자료 보기',
  10: '그라디언트 & 이미지 포토샵 자료 보기'
};

// 로컬 file:// 환경에서 History API나 URL 라우팅을 사용하지 않습니다.
// 강의 선택은 이 HTML 문서 내부 상태만 바꾸고 즉시 화면을 다시 그립니다.
let lesson = null;
let current = 1;
let total = null;

function pageRelativePath(n, page) {
  return `./FD${n}/${String(page).padStart(2, '0')}.png`;
}

function goLesson(n) {
  if (!LESSONS.includes(n)) return;
  lesson = n;
  current = 1;
  total = PAGE_TOTALS[n];
  renderViewer();
}

function goHome() {
  lesson = null;
  current = 1;
  total = null;
  renderList();
}

function renderList() {
  document.title = '파운데이션 강의 자료실';
  app.innerHTML = `
    <main class="list-page">
      <div class="eyebrow">FOUNDATION</div>
      <h1>파운데이션 강의 자료실</h1>
      <p class="lead">화살표 버튼 또는 키보드 방향키를 사용하여 페이지를 넘길 수 있습니다.</p>
      <section class="lesson-grid" aria-label="파운데이션 강의 목록">
        ${LESSONS.map(n => `
          <button class="lesson-card" data-lesson="${n}">
            <strong>파운데이션 ${n}강</strong>
            <span class="meta"><span>${LESSON_TOPICS[n]}</span>${[3,4,5].includes(n) ? '<span class="badge">SCRIPT</span>' : ''}</span>
          </button>`).join('')}
      </section>
    </main>`;
  app.querySelectorAll('[data-lesson]').forEach(btn => btn.addEventListener('click', () => goLesson(Number(btn.dataset.lesson))));
}

function renderViewer() {
  document.title = `파운데이션 ${lesson}강`;
  app.innerHTML = `
    <main class="viewer-page">
      <header class="toolbar">
        <div class="toolbar-left">
          <button class="toolbtn" id="homeBtn" title="목차로"><span>←</span><span class="label">목차</span></button>
        </div>
        <div class="title-wrap">
          <div class="viewer-title">파운데이션 ${lesson}강</div>
          <div class="page-count" id="pageCount">1 / …</div>
        </div>
        <div class="toolbar-right">
          ${[3,4,5].includes(lesson) ? '<button class="toolbtn primary" id="scriptBtn"><span>▤</span><span class="label">스크립트 보기</span></button>' : ''}
        </div>
      </header>
      <section class="stage" id="stage">
        <button class="navbtn prev" id="prevBtn" aria-label="이전 페이지">‹</button>
        <div class="slide-shell"><img id="slideImg" class="slide-img" alt="파운데이션 ${lesson}강 자료 보기" draggable="false" decoding="async"></div>
        <button class="navbtn next" id="nextBtn" aria-label="다음 페이지">›</button>
        <div class="loading" id="loading">자료를 불러오는 중…</div>
      </section>
    </main>`;

  document.getElementById('homeBtn').addEventListener('click', goHome);
  document.getElementById('prevBtn').addEventListener('click', () => showPage(current - 1));
  document.getElementById('nextBtn').addEventListener('click', () => showPage(current + 1));
  const sb = document.getElementById('scriptBtn');
  if (sb) sb.addEventListener('click', openScript);

  total = PAGE_TOTALS[lesson];
  showPage(1);
  updateNav();
}

function updateNav() {
  const prev = document.getElementById('prevBtn');
  const next = document.getElementById('nextBtn');
  const count = document.getElementById('pageCount');
  if (!prev || !next || !count) return;
  prev.disabled = current <= 1;
  next.disabled = total !== null ? current >= total : false;
  count.textContent = total !== null ? `${current} / ${total}` : `${current} / …`;
}


let imageRequestId = 0;

function showPage(page) {
  if (!lesson) return;
  if (page < 1 || page > total) return;

  const img = document.getElementById('slideImg');
  const loading = document.getElementById('loading');
  const relativePath = pageRelativePath(lesson, page);
  const requestId = ++imageRequestId;

  // 현재 이미지는 그대로 둔 상태에서 다음 이미지를 먼저 불러옵니다.
  // 로딩이 완료된 뒤에만 화면 이미지를 교체해 깜빡임과 잘못된 에러 표시를 막습니다.
  loading.hidden = false;

  const preloader = new Image();
  preloader.decoding = 'async';

  preloader.onload = () => {
    if (requestId !== imageRequestId) return;
    img.src = relativePath;
    img.alt = `파운데이션 ${lesson}강 ${page}페이지`;
    current = page;
    loading.hidden = true;
    updateNav();
  };

  preloader.onerror = () => {
    if (requestId !== imageRequestId) return;
    loading.hidden = true;
    console.warn(`이미지 로드 실패: ${relativePath}`);
  };

  preloader.src = relativePath;
}

function escapeHtml(value) {
  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function formatScriptHtml(text) {
  const lines = String(text || '').replace(/\r/g, '').split('\n');
  const parts = [];
  let sectionOpen = false;
  let chunk = [];

  const cue = /^(예를 들어|그래서|그런데|이번에는|그럼|자 |정리를 해보면|다만|특히|먼저|그다음|결과적으로|그러다 보니까|만약에|아주 옛날에는)/;

  const flushChunk = () => {
    if (!chunk.length) return;
    parts.push('<div class="script-chunk">' + chunk.join('') + '</div>');
    chunk = [];
  };
  const closeSection = () => {
    flushChunk();
    if (sectionOpen) {
      parts.push('</section>');
      sectionOpen = false;
    }
  };
  const openSection = (title = '', extra = '') => {
    closeSection();
    sectionOpen = true;
    parts.push(`<section class="script-section ${extra}">`);
    if (title) parts.push(`<h2>${escapeHtml(title)}</h2>`);
  };
  const pushParagraph = (html, forceBreakAfter = false) => {
    chunk.push(html);
    if (forceBreakAfter || chunk.length >= 4) flushChunk();
  };

  for (const original of lines) {
    const line = original.trim();
    if (!line) { flushChunk(); continue; }

    if (/^-{5,}$/.test(line)) {
      closeSection();
      parts.push('<hr>');
      continue;
    }
    if (line.startsWith('●')) {
      openSection(line.replace(/^●\s*/, ''));
      continue;
    }
    if (line.startsWith('💡')) {
      openSection(line.replace(/^💡\s*/, ''), 'color-section');
      continue;
    }
    if (/^\+\s*/.test(line)) {
      openSection(line.replace(/^\+\s*/, ''));
      continue;
    }
    if (!sectionOpen) openSection();

    // 인용/답변 박스는 딱 두 경우만: 원문 '>' 시작, 또는 '정답:' 시작.
    if (line.startsWith('>') || /^정답\s*:/.test(line)) {
      flushChunk();
      const answer = line.startsWith('>') ? line.replace(/^>\s*/, '') : line;
      parts.push(`<blockquote class="answer">${escapeHtml(answer)}</blockquote>`);
      continue;
    }
    if (line.startsWith('*')) {
      flushChunk();
      parts.push(`<aside class="note">${escapeHtml(line.replace(/^\*\s*/, ''))}</aside>`);
      continue;
    }
    if (/^\(시간이 남으면\)/.test(line)) {
      flushChunk();
      parts.push(`<h3>${escapeHtml(line)}</h3>`);
      continue;
    }

    if (cue.test(line) && chunk.length >= 1) flushChunk();
    const forceAfter = /[?？]$/.test(line) && chunk.length >= 2;
    pushParagraph(`<p>${escapeHtml(line)}</p>`, forceAfter);
  }

  closeSection();
  return parts.join('');
}

window.addEventListener('keydown', (e) => {
  if (!lesson) return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); showPage(current - 1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); showPage(current + 1); }
  if (e.key === 'Home') { e.preventDefault(); showPage(1); }
  if (e.key === 'Escape') goHome();
});
